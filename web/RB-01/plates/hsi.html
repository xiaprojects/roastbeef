<div ui-content-for="title">HSI</div>
<div id="hsi" class="hsi" style="--hsi-fg: {{HSI.fg}};">
  <div class="hsi-gs" ng-repeat="side in HSI.sides track by $index" ng-class="'hsi-gs-' + side">
    <div class="hsi-gs-label" ng-show="HSI.gsActive">GS</div>
    <div class="hsi-gs-dot" ng-repeat="i in HSI.gsDots track by $index" ng-class="{'hsi-gs-dot-center': i == 0}" style="--i: {{::i}};"></div>
    <div class="hsi-gs-diamond" ng-show="HSI.showGs" style="transform: translate(-50%, -50%) translateY({{HSI.gs}});"></div>
  </div>
  <div class="hsi-card" style="transform: rotate({{HSI.card}});">
    <div class="hsi-tick" ng-repeat="t in HSI.ticks track by $index" ng-class="{'hsi-tick-big': t.big}" style="transform: rotate({{::t.deg}}deg);"></div>
    <div class="hsi-label" ng-repeat="l in HSI.labels track by $index" ng-class="{'hsi-cardinal': l.cardinal, 'hsi-north': l.deg == 0}" style="transform: rotate({{::l.deg}}deg);"><span>{{::l.text}}</span></div>
  </div>
  <div class="hsi-course" style="transform: rotate({{HSI.course}});">
    <div class="hsi-ring"></div>
    <div class="hsi-cdi" ng-show="HSI.showCdi" style="transform: translate(-50%, -50%) translateX({{HSI.cdi}});"></div>
    <div class="hsi-dot" ng-repeat="i in HSI.courseDots track by $index" style="--i: {{::i}};"></div>
    <div class="hsi-arrow"></div>
    <div class="hsi-tail"></div>
    <div class="hsi-bug-layer" style="transform: rotate({{HSI.bug}});"><div class="hsi-bug"></div></div>
  </div>
  <div class="hsi-lubber"></div>
  <div class="hsi-aircraft-a"></div>
  <div class="hsi-aircraft-b"></div>
  <div class="hsi-aircraft-c"></div>
  <!-- No GPS fix: the same red X as an attitude failure, see -->
  <!-- the attitude plate; transparent so the last picture stays readable -->
  <div class="attitude-fail" ng-if="gpsNoFix" style="background-color: transparent; pointer-events: none; z-index: 1000;">
    <div class="attitude-fail-x"></div>
    <div class="attitude-fail-x attitude-fail-x-back"></div>
    <div class="attitude-fail-label">NO GPS FIX</div>
  </div>
</div>
