<div ui-content-for="title">Switchboard</div>
<!-- Fixed-size tiles in a grid: a long name wraps to two lines and is then
     cut with an ellipsis, so it can never resize its button or push the
     row out of line. The full name stays in the tooltip. -->
<div class="switchBoardGrid">
    <button type="button" class="switchBoardButton" data-keypad="tap"
        ng-repeat="item in switches" ng-click="sendCommand($index)" title="{{item.Name}}">
        <span class="switchBoardButtonName">{{item.Name}}</span>
        <span class="switchBoardButtonLight switchButtonStatus{{item.Status}}"></span>
    </button>
</div>
